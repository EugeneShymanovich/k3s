---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Install k3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="server \
        --node-ip={{ private_ip }} \
        --flannel-iface={{ k3s_flannel_iface }} \
        --tls-san={{ ansible_host }} \
        {{ k3s_extra_server_args }}" sh -
  args:
    executable: /bin/bash
  register: k3s_server_install
  retries: 3
  delay: 10
  until: k3s_server_install is succeeded
  when: not k3s_bin.stat.exists

- name: Ensure the k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for the control-plane node to become Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 5
  changed_when: false

- name: Read the k3s node token
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  changed_when: false
  no_log: true

- name: Publish the node token for the agent play
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.stdout }}"
  no_log: true
