# k3s installer settings
k3s_version: "v1.36.4+k3s1"
k3s_api_port: 6443

# Extra flags appended to the server / agent install command.
# Traefik is kept (default), Hetzner CCM is not used.
k3s_extra_server_args: ""
k3s_extra_agent_args: ""

# Where the fetched kubeconfig lands on the local machine.
kubeconfig_local_path: "{{ lookup('env', 'HOME') }}/.kube/k3s-test.yaml"

# Extra public IP added to the API server certificate (besides the
# public IP of the control plane, which is used automatically).
# k3s_extra_tls_san: ""
